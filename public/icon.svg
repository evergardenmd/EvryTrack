<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="#09120D"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#border_grad)" stroke-width="12" opacity="0.9"/>

  <!-- Subtle Radial Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#center_glow)" opacity="0.35"/>

  <!-- Main Emerald Leaf Path -->
  <path d="M256 72C256 72 400 136 400 272C400 352 336 416 256 424C256 424 200 328 200 248C200 168 256 72 256 72Z" fill="url(#leaf_main)"/>
  
  <!-- Back Leaf Layer -->
  <path d="M256 72C256 72 136 144 136 272C136 344 184 408 240 422C216 352 216 272 256 72Z" fill="url(#leaf_back)" opacity="0.85"/>

  <!-- Leaf Vein & Financial Trend Line (Gold & Mint) -->
  <path d="M256 424C256 424 256 260 352 144" stroke="#F59E0B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 312L312 248" stroke="#34D399" stroke-width="12" stroke-linecap="round"/>
  <path d="M256 248L328 192" stroke="#34D399" stroke-width="12" stroke-linecap="round"/>

  <!-- Bottom Stem -->
  <path d="M256 424L216 464" stroke="#34D399" stroke-width="16" stroke-linecap="round"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="border_grad" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="center_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#09120D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf_main" x1="200" y1="72" x2="400" y2="424">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="leaf_back" x1="136" y1="72" x2="256" y2="422">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>
</svg>